app-id: io.github.ik3rurru.WindowDeck
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: windowdeck-client

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: windowdeck
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # Prototype build uses Cargo's network; vendor sources before Flathub submission.
      build-args:
        - --share=network
    build-commands:
      - command -v ffplay
      - cargo build --locked --release -p windowdeck-client --features native-media
      - install -Dm0755 target/release/windowdeck-client /app/bin/windowdeck-client
      - install -Dm0644 packaging/WindowDeck.desktop /app/share/applications/io.github.ik3rurru.WindowDeck.desktop
      - sed -i 's|^Exec=.*|Exec=windowdeck-client --fullscreen|' /app/share/applications/io.github.ik3rurru.WindowDeck.desktop
      - install -Dm0644 assets/WindowDeck.png /app/share/icons/hicolor/256x256/apps/io.github.ik3rurru.WindowDeck.png
      - install -Dm0644 packaging/flatpak/io.github.ik3rurru.WindowDeck.metainfo.xml /app/share/metainfo/io.github.ik3rurru.WindowDeck.metainfo.xml
      - desktop-file-validate /app/share/applications/io.github.ik3rurru.WindowDeck.desktop
      - /app/bin/windowdeck-client --media-self-test
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
