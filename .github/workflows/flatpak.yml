name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/windowdeck-client/**
      - crates/windowdeck-diagnostics/**
      - crates/windowdeck-protocol/**
      - packaging/flatpak/**
      - .github/workflows/flatpak.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: WindowDeck.flatpak
          manifest-path: packaging/flatpak/io.github.ik3rurru.WindowDeck.yml
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: WindowDeck-flatpak
