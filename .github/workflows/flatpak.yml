name: Flatpak

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/windowdeck-client/**
      - crates/windowdeck-media/**
      - crates/windowdeck-diagnostics/**
      - crates/windowdeck-protocol/**
      - packaging/**
      - assets/WindowDeck.png
      - scripts/install-steamdeck.sh
      - scripts/package-steamdeck.sh
      - .gitattributes
      - .github/workflows/flatpak.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: WindowDeck.flatpak
          manifest-path: packaging/flatpak/io.github.ik3rurru.WindowDeck.yml
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: WindowDeck-flatpak
      - name: Package Steam Deck installer
        id: installer
        shell: bash
        run: |
          archive=$(bash scripts/package-steamdeck.sh)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: WindowDeck-steamdeck
          path: ${{ steps.installer.outputs.archive }}
          if-no-files-found: error
