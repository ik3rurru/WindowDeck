name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  flatpak:
    uses: ./.github/workflows/flatpak.yml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - name: Build Windows applications and media
        shell: pwsh
        run: ./scripts/build-media.ps1 -Download
      - name: Build display helper without installing the driver
        shell: pwsh
        run: ./driver/windows-idd/build.ps1 -ControlOnly -Toolset v143 -SdkVersion 10.0
      - name: Package and verify
        id: package
        shell: pwsh
        run: |
          $archive = ./scripts/package-windows.ps1 -SkipBuild -Release
          ./scripts/test-windows-package.ps1 -Archive $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: WindowDeck-windows
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    needs: [checks, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: WindowDeck-*
          merge-multiple: true
          path: target/release-assets
      - name: Verify version and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
          cd target/release-assets
          test -s "WindowDeck-$version-windows-x64.zip"
          test -s "WindowDeck-$version-steamdeck-x86_64.tar.gz"
          test -s WindowDeck.flatpak
          sha256sum *.zip *.tar.gz *.flatpak > SHA256SUMS.txt
      - name: Publish complete preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" target/release-assets/* \
            --verify-tag --title "WindowDeck $RELEASE_TAG (preview)" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --prerelease
