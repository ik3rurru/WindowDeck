name: CI

on:
  workflow_call:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - if: runner.os == 'Linux'
        run: |
          bash -n scripts/install-steamdeck.sh scripts/package-steamdeck.sh packaging/steamdeck/windowdeck
          python3 scripts/test-steamdeck-installer.py
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-launcher.ps1 -Launcher target/debug/windowdeck-launcher.exe

  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-dev libavutil-dev libswscale-dev libsdl2-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/build-media.ps1 -Download -PrepareOnly
          "WINDOWDECK_FFMPEG_DIR=$env:WINDOWDECK_FFMPEG_DIR" >> $env:GITHUB_ENV
          "WINDOWDECK_SDL_DIR=$env:WINDOWDECK_SDL_DIR" >> $env:GITHUB_ENV
          "$env:WINDOWDECK_FFMPEG_DIR/bin" >> $env:GITHUB_PATH
          "$env:WINDOWDECK_SDL_DIR/lib/x64" >> $env:GITHUB_PATH
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p windowdeck-host --all-features cpu_encoder_output_decodes_after_fragmented_transport -- --ignored --nocapture
        timeout-minutes: 3
      - run: cargo run --locked -p windowdeck-client --features native-media -- --media-self-test
      - if: runner.os == 'Linux'
        run: |
          python3 scripts/test-native-client.py --client target/debug/windowdeck-client
          python3 scripts/test-native-client.py --client target/debug/windowdeck-client --legacy-handshake
      - if: runner.os == 'Windows'
        run: |
          python scripts/test-native-client.py --client target/debug/windowdeck-client.exe
          python scripts/test-native-client.py --client target/debug/windowdeck-client.exe --legacy-handshake
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./driver/windows-idd/build.ps1 -ControlOnly -Toolset v143 -SdkVersion 10.0
